# Workflow for building and deploying an Academic Pages / Jekyll site to GitHub Pages
name: Deploy Academic Pages template site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Diagnose and enable Pages administration
        run: |
          TOKEN="${{ github.token }}"
          REPO="${{ github.repository }}"
          API="https://api.github.com/repos/$REPO"
          HDR=(-H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          echo "== GET /pages (current token) =="
          curl -s -w "\nHTTP %{http_code}\n" "${HDR[@]}" "$API/pages" || true
          echo "== GET /actions/permissions/workflow =="
          curl -s -w "\nHTTP %{http_code}\n" "${HDR[@]}" "$API/actions/permissions/workflow" || true
          echo "== PUT /actions/permissions/workflow -> write default =="
          curl -s -w "\nHTTP %{http_code}\n" -X PUT "${HDR[@]}" "$API/actions/permissions/workflow" -d '{"default_workflow_permissions":"write","can_approve_pull_request_reviews":true}' || true
          echo "== POST /pages (build_type=workflow) =="
          curl -s -w "\nHTTP %{http_code}\n" -X POST "${HDR[@]}" "$API/pages" -d '{"build_type":"workflow"}' || true
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'        
      - name: Setup Ruby, JRuby and TruffleRuby
        uses: ruby/setup-ruby@v1.328.0
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0
      - name: Install UglifyJS
        run: npm install -g uglify-js
      - name: Minify JS files
        run: |
          uglifyjs assets/js/plugins/jquery.greedy-navigation.js assets/js/_main.js assets/js/theme.js -c -m -o assets/js/main.min.js
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6.0.0
        with:
          enablement: true
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
